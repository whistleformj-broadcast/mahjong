<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🀄 哨子麻將村 · 開播行程</title>
<!-- 純瀏覽頁:只「讀取」Firebase 的 schedule / signups,不會寫入任何資料 -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{ --felt:#0f5132; --felt2:#0b3d26; --gold:#D8A94E; --ivory:#F6F1E3; --jade:#2E8B62; --red:#C4443B; --muted:rgba(246,241,227,.6); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(160deg,var(--felt),var(--felt2));color:var(--ivory);min-height:100vh;padding:18px 14px 50px}
  .head{max-width:720px;margin:0 auto 18px;text-align:center}
  h1{font-size:26px;margin:0 0 4px;letter-spacing:3px;color:var(--gold);font-weight:900}
  .sub{font-size:14px;color:var(--muted);letter-spacing:1px}
  #badge{display:inline-block;font-size:12px;font-weight:700;margin-top:8px;padding:3px 10px;border-radius:20px;background:rgba(0,0,0,.25)}
  .wrap{max-width:720px;margin:0 auto}
  .card{background:var(--ivory);border-radius:16px;padding:16px 20px;margin-bottom:14px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
  .card.off{opacity:.7}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .date{font-size:30px;font-weight:900;color:#22201A;line-height:1;white-space:nowrap}
  .wd{font-size:16px;font-weight:700;color:#8A8264;margin-left:3px}
  .time{font-size:23px;font-weight:900;color:var(--jade);white-space:nowrap}
  .jiang{font-size:20px;font-weight:900;color:#5A5442;white-space:nowrap}
  .badge{font-size:15px;font-weight:900;color:#fff;padding:5px 14px;border-radius:16px;white-space:nowrap;margin-left:auto}
  .roster{margin-top:12px;font-size:20px;color:#3F3B2E;font-weight:800;line-height:1.5}
  .cnt{font-size:16px;font-weight:900;color:var(--red);background:#F3E9CF;padding:2px 10px;border-radius:12px;margin-right:8px}
  .full{color:#1D9E63;font-weight:900}
  .memo{display:block;font-size:20px;font-weight:700;color:#9A968A;margin-top:6px}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:16px}
  .foot{max-width:720px;margin:20px auto 0;text-align:center;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
  <div class="head">
    <h1>🀄 開播行程</h1>
    <div class="sub">哪幾天有開 · 幾點開 · 當天有誰</div>
    <span id="badge">⚪ 載入中…</span>
  </div>
  <div class="wrap" id="list"><div class="empty">載入中…</div></div>
  <div class="foot">此頁會即時更新 · 只供查詢</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDtdbutDjabe9FDj9Z5HXQkj5m1NAtXj6I",
  authDomain: "live-mjbroadcast2026.firebaseapp.com",
  databaseURL: "https://live-mjbroadcast2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "live-mjbroadcast2026",
  storageBucket: "live-mjbroadcast2026.firebasestorage.app",
  messagingSenderId: "993789032431",
  appId: "1:993789032431:web:41480070253c3c2cf5281a"
};
const ROOM_ID = "howard-mj-room-2026";
const WD=['日','一','二','三','四','五','六'];
const ST={open:{t:'確定開',c:'#37D08A'},tentative:{t:'暫定',c:'#E6B84A'},off:{t:'休息',c:'#9AA0A6'}};

let schedule=[], signups={};
function asArray(v){return Array.isArray(v)?v.filter(Boolean):Object.values(v||{}).filter(Boolean);}
function esc(s){return (''+(s||'')).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function skey(r){return (r&&(r.id||r.date))||'';}
function daySignups(date){const v=signups[date];return Array.isArray(v)?v.filter(Boolean):(v?Object.values(v).filter(Boolean):[]);}

function render(){
  const el=document.getElementById('list');
  const now=new Date();
  const today=new Date();today.setHours(0,0,0,0);
  const end=new Date(today);end.setDate(end.getDate()+21);
  const rows=(schedule||[]).filter(r=>r&&r.date).map(r=>{
    const tm=(r.time&&/^\d{1,2}:\d{2}$/.test(r.time))?r.time:'23:59';
    return {r, d:new Date(r.date+'T00:00:00'), start:new Date(r.date+'T'+tm+':00')};
  }).filter(x=>!isNaN(x.start)&&x.start>now&&x.d<=end).sort((a,b)=>a.start-b.start);

  if(!rows.length){ el.innerHTML='<div class="empty">近三週還沒有安排,敬請期待 🀄</div>'; return; }

  el.innerHTML=rows.map(({r,d})=>{
    const st=r.status||'open';
    const stt=ST[st]||ST.open;
    const md=(d.getMonth()+1)+'/'+d.getDate();
    const timeHtml=(st!=='off'&&r.time)?'<span class="time">'+esc(r.time)+'</span>':'';
    const jiangHtml=(st!=='off'&&r.jiang)?'<span class="jiang">'+esc(r.jiang)+'將</span>':'';
    let rosterHtml='';
    if(st==='off'){
      rosterHtml='<div class="roster" style="color:#9A968A">今天休息</div>';
    }else{
      const sus=daySignups(skey(r));
      const full=sus.length>=4?'<span class="full"> ✅滿</span>':'';
      const nm=sus.length?sus.map(esc).join('、'):'尚無人報名';
      const memo=r.note?'<span class="memo">'+esc(r.note)+'</span>':'';
      rosterHtml='<div class="roster"><span class="cnt">報名 '+sus.length+'/4</span>'+nm+full+memo+'</div>';
    }
    return '<div class="card'+(st==='off'?' off':'')+'">'
      +'<div class="top">'
        +'<span class="date">'+md+'<span class="wd">(週'+WD[d.getDay()]+')</span></span>'
        +timeHtml+jiangHtml
        +'<span class="badge" style="background:'+stt.c+'">'+stt.t+'</span>'
      +'</div>'
      +rosterHtml
    +'</div>';
  }).join('');
}

(function init(){
  if(typeof firebase==='undefined'){document.getElementById('badge').textContent='🔴 載入失敗';return;}
  try{ firebase.initializeApp(firebaseConfig); }catch(e){}
  firebase.auth().signInAnonymously().catch(()=>document.getElementById('badge').textContent='🔴 連線失敗');
  firebase.auth().onAuthStateChanged(function(user){
    if(!user)return;
    document.getElementById('badge').textContent='🟢 已連線';
    firebase.database().ref('rooms/'+ROOM_ID+'/schedule').on('value',s=>{ schedule=asArray(s.val()); render(); });
    firebase.database().ref('rooms/'+ROOM_ID+'/signups').on('value',s=>{ signups=s.val()||{}; render(); });
  });
  // 每分鐘重繪一次,讓過了開播時間的場次自動消失
  setInterval(render,60000);
})();
</script>
</body>
</html>
